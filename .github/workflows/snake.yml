name: Generate Snake Graph

on:
  # 24 နာရီတစ်ကြိမ် အလိုအလျောက် run မည်
  schedule:
    - cron: "0 0 * * *"
  
  # Manual မောင်းနှင်ခွင့်ပြုမည်
  workflow_dispatch:
  
  # main branch သို့ push လုပ်တိုင်း run မည်
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Snake animation generate ပြုလုပ်ခြင်း
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # ရရှိလာသော SVG များကို output branch ထဲသို့ push လုပ်ခြင်း
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}